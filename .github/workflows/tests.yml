name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: |
          set -o pipefail
          pytest -q -p no:logging 2>&1 | tee pytest.txt || { grep -nE "Error|Exception|raise |File \"/home/runner/work" pytest.txt | grep -v "^.*site-packages/_pytest" | head -60 | sed 's/^/::warning::/'; exit 1; }
