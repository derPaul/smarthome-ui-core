name: Release

# Either push a v* tag, or start the workflow manually: it then releases the
# version from manifest.json and creates the tag itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Determine tag
        run: |
          version=$(jq -r .version custom_components/smarthome_ui/manifest.json)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}"
            exit 1
          fi
          echo "TAG=v${version}" >> "${GITHUB_ENV}"

      - name: Run tests
        run: |
          pip install -r requirements_test.txt
          ruff check .
          pytest -q

      - name: Build zip
        run: |
          cd custom_components/smarthome_ui
          zip -r "${GITHUB_WORKSPACE}/smarthome_ui.zip" . -x "__pycache__/*" "*/__pycache__/*"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" smarthome_ui.zip \
            --target "${GITHUB_SHA}" --title "${TAG}" --generate-notes
