task_done:
  fields:
    task:
      required: true
      example: "Bad putzen"
      selector:
        text:

task_reopen:
  fields:
    task:
      required: true
      example: "Bad putzen"
      selector:
        text:

waste_ack:
  fields:
    date:
      required: true
      selector:
        date:

waste_skip:
  fields:
    date:
      required: true
      selector:
        date:

area_mowed:
  fields:
    area:
      required: true
      example: "Vorgarten"
      selector:
        text:

test_notify:
  fields:
    message:
      example: "Hallo von Smarthome UI"
      selector:
        text:

vacuum_rooms:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          filter:
            domain: vacuum
    areas:
      required: true
      selector:
        area:
          multiple: true
    skip_hours:
      default: 0
      selector:
        number:
          min: 0
          max: 48
          unit_of_measurement: h
    vacuum_only:
      default: true
      selector:
        boolean:
