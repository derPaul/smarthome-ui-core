blueprint:
  name: Bewegungslicht (Smarthome UI Core)
  description: >-
    Licht an, sobald ein Bewegungs- oder Präsenzmelder etwas erkennt, und aus, wenn
    für die eingestellte Zeit keiner mehr etwas meldet (ohne eigene Zeit gilt die
    Standard-Abklingzeit aus Smarthome UI Core). Die Helligkeit kommt zentral
    aus Smarthome UI Core: tagsüber die Taghelligkeit, nachts die Nachthelligkeit
    (Gerät „Licht“). Optional nur, wenn es dunkel genug ist.
  domain: automation
  source_url: https://github.com/derPaul/smarthome-ui-core/blob/main/custom_components/smarthome_ui/blueprints/motion_light.yaml
  input:
    motion:
      name: Bewegungsmelder
      selector:
        entity:
          multiple: true
          filter:
            domain: binary_sensor
    light:
      name: Lichter
      selector:
        entity:
          multiple: true
          filter:
            domain: light
    delay:
      name: Aus nach … ohne Bewegung
      description: 0 = Standard-Abklingzeit aus Smarthome UI Core (Gerät „Licht“).
      default: 0
      selector:
        number:
          min: 0
          max: 3600
          step: 10
          unit_of_measurement: s
    illuminance:
      name: Helligkeitssensor (optional)
      description: Leer lassen, wenn das Licht immer angehen soll.
      default: ""
      selector:
        entity:
          filter:
            domain: sensor
            device_class: illuminance
    dark:
      name: Dunkel-Sensor (optional)
      description: >-
        Ein/Aus-Sensor, der bei Dunkelheit „an“ meldet (z. B. „Ist dunkel“ einer Kamera). Leer
        lassen, wenn das Licht immer angehen soll.
      default: ""
      selector:
        entity:
          filter:
            domain: binary_sensor
    lux_max:
      name: Nur unter … Lux
      default: 30
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: lx
    day_pct:
      name: Eigene Taghelligkeit
      description: 0 = Taghelligkeit aus Smarthome UI Core.
      default: 0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    night_pct:
      name: Eigene Nachthelligkeit
      description: 0 = Nachthelligkeit aus Smarthome UI Core.
      default: 0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    restore:
      name: Danach Ausgangszustand wiederherstellen
      description: >-
        Statt auszuschalten kommen die Lichter nach der Abklingzeit wieder so, wie sie vor der
        Bewegung waren (z. B. ein Grundlicht am Eingang wieder auf 10 %, die anderen aus).
      default: false
      selector:
        boolean:
    fade_on:
      name: Eigenes Einblenden
      description: -1 = Einblenden aus Smarthome UI Core, 0 = sofort an.
      default: -1
      selector:
        number:
          min: -1
          max: 10
          step: 0.5
          unit_of_measurement: s
    fade_off:
      name: Eigenes Ausblenden
      description: -1 = Ausblenden aus Smarthome UI Core, 0 = sofort aus.
      default: -1
      selector:
        number:
          min: -1
          max: 10
          step: 0.5
          unit_of_measurement: s
    day_brightness:
      name: Taghelligkeit (zentral)
      default: number.lights_brightness_day
      selector:
        entity:
          filter:
            domain: number
    night_brightness:
      name: Nachthelligkeit (zentral)
      default: number.lights_brightness_night
      selector:
        entity:
          filter:
            domain: number
    night_start:
      name: Nacht ab (zentral)
      default: time.lights_night_start
      selector:
        entity:
          filter:
            domain: time
    night_end:
      name: Nacht bis (zentral)
      default: time.lights_night_end
      selector:
        entity:
          filter:
            domain: time
    default_delay:
      name: Standard-Abklingzeit (zentral)
      default: number.lights_delay
      selector:
        entity:
          filter:
            domain: number
    default_fade_on:
      name: Einblenden (zentral)
      default: number.lights_fade_on
      selector:
        entity:
          filter:
            domain: number
    default_fade_off:
      name: Ausblenden (zentral)
      default: number.lights_fade_off
      selector:
        entity:
          filter:
            domain: number

mode: restart
max_exceeded: silent

trigger_variables:
  own_delay: !input delay
  delay_entity: !input default_delay

variables:
  motion_ids: !input motion
  light_ids: !input light
  lux_entity: !input illuminance
  lux_max: !input lux_max
  dark_entity: !input dark
  day_entity: !input day_brightness
  night_entity: !input night_brightness
  start_entity: !input night_start
  end_entity: !input night_end
  own_day: !input day_pct
  own_night: !input night_pct
  restore: !input restore
  # Merkszene des Ausgangszustands (scene.ml_<automation>), lebt nur bis zum Wiederherstellen
  snap_id: "ml_{{ this.entity_id.split('.')[1] if this is defined and this.entity_id is defined else 'light' }}"
  snap: "scene.{{ snap_id }}"
  own_fade_on: !input fade_on
  own_fade_off: !input fade_off
  fade_on_entity: !input default_fade_on
  fade_off_entity: !input default_fade_off
  # eigenes Ein-/Ausblenden dieser Automation (ab 0 s), sonst das zentrale
  fade_in: >-
    {{ own_fade_on | float(-1) if own_fade_on | float(-1) >= 0
       else states(fade_on_entity) | float(1) if fade_on_entity else 1 }}
  fade_out: >-
    {{ own_fade_off | float(-1) if own_fade_off | float(-1) >= 0
       else states(fade_off_entity) | float(1) if fade_off_entity else 1 }}

triggers:
  - trigger: state
    entity_id: !input motion
    to: "on"
    id: "on"
  - trigger: state
    entity_id: !input motion
    to: "off"
    # eigene Zeit, sonst die zentrale (beim Ausschalten des Melders gelesen)
    for:
      seconds: >-
        {{ own_delay | int(0) if own_delay | int(0) > 0
           else states(delay_entity) | int(120) if delay_entity else 120 }}
    id: "off"

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: "on"
        sequence:
          # dunkel genug oder Licht schon an? Sonst bis zu 30 s auf einen neuen Messwert warten: direkt nach
          # dem Ausschalten meldet der Sensor oft noch die Helligkeit mit Licht (das Licht bliebe sonst aus)
          # mit Dunkel-Sensor: nur wenn er „an“ meldet (oder das Licht schon an ist)
          - wait_template: >-
              {% set lit = expand(light_ids) | selectattr('state', 'eq', 'on') | list | count > 0 %}
              {{ lit or ((not lux_entity or states(lux_entity) | float(0) <= lux_max | float(30))
                         and (not dark_entity or is_state(dark_entity, 'on'))) }}
            timeout: "00:00:30"
            continue_on_timeout: false
          - variables:
              ns: "{{ states(start_entity)[:5] }}"
              ne: "{{ states(end_entity)[:5] }}"
              t: "{{ now().strftime('%H:%M') }}"
              night: "{{ (t >= ns or t < ne) if ns > ne else (ns <= t < ne) }}"
              # eigene Helligkeit dieser Automation, sonst die zentrale
              own: "{{ (own_night if night else own_day) | int(0) }}"
              pct: >-
                {{ own if own > 0
                   else states(night_entity) | int(20) if night else states(day_entity) | int(100) }}
          # Ausgangszustand merken, nur am Anfang (bei erneuter Bewegung steht die Szene schon)
          - if:
              - condition: template
                value_template: >-
                  {{ restore and snap not in states.scene | map(attribute='entity_id') | list }}
            then:
              - action: scene.create
                data:
                  scene_id: "{{ snap_id }}"
                  snapshot_entities: "{{ light_ids }}"
          - action: light.turn_on
            target:
              entity_id: "{{ light_ids }}"
            data:
              brightness_pct: "{{ pct }}"
              transition: "{{ fade_in }}"
      - conditions:
          - condition: trigger
            id: "off"
          - condition: template
            value_template: >-
              {{ expand(motion_ids) | selectattr('state', 'eq', 'on') | list | count == 0 }}
        sequence:
          # Ausgangszustand zurück (fehlt die Merkszene, z. B. nach einem Neustart: ausschalten)
          - if:
              - condition: template
                value_template: >-
                  {{ restore and snap in states.scene | map(attribute='entity_id') | list }}
            then:
              - action: scene.turn_on
                target:
                  entity_id: "{{ snap }}"
                data:
                  transition: "{{ fade_out }}"
              - action: scene.delete
                target:
                  entity_id: "{{ snap }}"
            else:
              - action: light.turn_off
                target:
                  entity_id: "{{ light_ids }}"
                data:
                  transition: "{{ fade_out }}"
