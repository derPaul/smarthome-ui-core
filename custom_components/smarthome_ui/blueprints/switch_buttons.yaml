blueprint:
  name: Schalter-Tasten (Smarthome UI Core)
  description: >-
    Jede Taste eines Schalters frei belegen – getrennt für kurz drücken, lang drücken und gedrückt
    halten (wiederholt, z. B. zum Dimmen). Gedacht für den Hue Dimmer Switch (Ein, Heller, Dunkler,
    Aus), passt aber zu jedem Schalter, dessen Tasten in Home Assistant als Ereignis-Entität
    erscheinen (Hue, Matter, Shelly …). Je Taste lassen sich auch mehrere Entitäten wählen, z. B.
    dieselbe Taste an zwei Schaltern. Schalter in Zigbee2MQTT: statt der Tasten unten unter
    „Zigbee2MQTT“ den Namen des Schalters eintragen – die Tasten Ein, Heller, Dunkler und Aus sind dann
    Taste 1 bis 4.
  domain: automation
  source_url: https://github.com/derPaul/smarthome-ui-core/blob/main/custom_components/smarthome_ui/blueprints/switch_buttons.yaml
  input:
    taste_1:
      name: "Taste 1 (Hue Dimmer: Ein)"
      icon: mdi:numeric-1-box-outline
      input:
        button_1:
          name: Taste
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: event
        short_1:
          name: Kurz drücken
          default: []
          selector:
            action:
        long_1:
          name: Lang drücken
          description: Einmal, sobald die Taste etwa eine Sekunde gehalten wird.
          default: []
          selector:
            action:
        hold_1:
          name: Gedrückt halten (wiederholt)
          description: Läuft immer wieder, solange die Taste gehalten wird – z. B. heller dimmen.
          default: []
          selector:
            action:
    taste_2:
      name: "Taste 2 (Hue Dimmer: Heller)"
      icon: mdi:numeric-2-box-outline
      input:
        button_2:
          name: Taste
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: event
        short_2:
          name: Kurz drücken
          default: []
          selector:
            action:
        long_2:
          name: Lang drücken
          default: []
          selector:
            action:
        hold_2:
          name: Gedrückt halten (wiederholt)
          default: []
          selector:
            action:
    taste_3:
      name: "Taste 3 (Hue Dimmer: Dunkler)"
      icon: mdi:numeric-3-box-outline
      input:
        button_3:
          name: Taste
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: event
        short_3:
          name: Kurz drücken
          default: []
          selector:
            action:
        long_3:
          name: Lang drücken
          default: []
          selector:
            action:
        hold_3:
          name: Gedrückt halten (wiederholt)
          default: []
          selector:
            action:
    taste_4:
      name: "Taste 4 (Hue Dimmer: Aus)"
      icon: mdi:numeric-4-box-outline
      input:
        button_4:
          name: Taste
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: event
        short_4:
          name: Kurz drücken
          default: []
          selector:
            action:
        long_4:
          name: Lang drücken
          default: []
          selector:
            action:
        hold_4:
          name: Gedrückt halten (wiederholt)
          default: []
          selector:
            action:
    zigbee2mqtt:
      name: Zigbee2MQTT
      icon: mdi:zigbee
      collapsed: true
      input:
        z2m_name:
          name: Name des Schalters in Zigbee2MQTT
          description: >-
            Genau wie in Zigbee2MQTT (z. B. „Office - Switch“). Leer lassen bei Schaltern über die
            Hue Bridge. Kurz = *_press_release, lang = beim Loslassen nach langem Drücken
            (*_hold_release), gedrückt halten = *_hold.
          default: ""
          selector:
            text:
        z2m_base:
          name: Basis-Topic
          default: zigbee2mqtt
          selector:
            text:
    erweitert:
      name: Erweitert
      icon: mdi:tune-variant
      collapsed: true
      input:
        short_types:
          name: Ereignisse für „kurz“
          description: Hue meldet short_release; andere Schalter z. B. press oder single.
          default: [short_release]
          selector:
            text:
              multiple: true
        long_types:
          name: Ereignisse für „lang“
          default: [long_press]
          selector:
            text:
              multiple: true
        hold_types:
          name: Ereignisse für „gedrückt halten“
          default: [repeat]
          selector:
            text:
              multiple: true

mode: queued
max: 10
max_exceeded: silent

trigger_variables:
  z2m_name: !input z2m_name
  z2m_base: !input z2m_base

triggers:
  - trigger: mqtt
    topic: "{{ z2m_base }}/{{ z2m_name if z2m_name else '-' }}/action"
    id: z2m
  - trigger: state
    entity_id: !input button_1
    not_from: unavailable
    id: "1"
  - trigger: state
    entity_id: !input button_2
    not_from: unavailable
    id: "2"
  - trigger: state
    entity_id: !input button_3
    not_from: unavailable
    id: "3"
  - trigger: state
    entity_id: !input button_4
    not_from: unavailable
    id: "4"

variables:
  short_types: !input short_types
  long_types: !input long_types
  hold_types: !input hold_types
  # Zigbee2MQTT: Aktion wie on_press_release / up_hold / off_hold_release
  # Ereignis-Entität: event_type wie short_release / long_press / repeat
  press: >-
    {% if trigger.id == 'z2m' %}{{ trigger.payload | replace('-', '_') }}
    {%- else %}{{ trigger.to_state.attributes.event_type | default('') }}{% endif %}
  button: >-
    {% if trigger.id == 'z2m' %}{{ {'on': 'b1', 'up': 'b2', 'down': 'b3', 'off': 'b4'}.get(press.split('_')[0], '') }}
    {%- else %}b{{ trigger.id }}{% endif %}
  kind: >-
    {% if trigger.id == 'z2m' %}{{ 'short' if press.endswith('_press_release')
       else 'long' if press.endswith('_hold_release') else 'hold' if press.endswith('_hold') else '' }}
    {%- else %}{{ 'short' if press in short_types else 'long' if press in long_types
       else 'hold' if press in hold_types else '' }}{% endif %}
  # nur frische Ereignisse (der Zustand ist der Zeitpunkt): ein Neustart stellt den letzten wieder her
  fresh: >-
    {% if trigger.id == 'z2m' %}true{% else %}{% set t = as_datetime(trigger.to_state.state) %}
    {{- t is not none and (now() - t).total_seconds() < 10 }}{% endif %}

conditions:
  - condition: template
    value_template: "{{ button != '' and kind != '' and fresh }}"

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ button == 'b1' and kind == 'short' }}"
        sequence: !input short_1
      - conditions:
          - condition: template
            value_template: "{{ button == 'b1' and kind == 'long' }}"
        sequence: !input long_1
      - conditions:
          - condition: template
            value_template: "{{ button == 'b1' and kind == 'hold' }}"
        sequence: !input hold_1
      - conditions:
          - condition: template
            value_template: "{{ button == 'b2' and kind == 'short' }}"
        sequence: !input short_2
      - conditions:
          - condition: template
            value_template: "{{ button == 'b2' and kind == 'long' }}"
        sequence: !input long_2
      - conditions:
          - condition: template
            value_template: "{{ button == 'b2' and kind == 'hold' }}"
        sequence: !input hold_2
      - conditions:
          - condition: template
            value_template: "{{ button == 'b3' and kind == 'short' }}"
        sequence: !input short_3
      - conditions:
          - condition: template
            value_template: "{{ button == 'b3' and kind == 'long' }}"
        sequence: !input long_3
      - conditions:
          - condition: template
            value_template: "{{ button == 'b3' and kind == 'hold' }}"
        sequence: !input hold_3
      - conditions:
          - condition: template
            value_template: "{{ button == 'b4' and kind == 'short' }}"
        sequence: !input short_4
      - conditions:
          - condition: template
            value_template: "{{ button == 'b4' and kind == 'long' }}"
        sequence: !input long_4
      - conditions:
          - condition: template
            value_template: "{{ button == 'b4' and kind == 'hold' }}"
        sequence: !input hold_4
